
VIS:
  # AMOUNT RAW-FRAMES NEED ROTATED BEFORE REDUCTION
  clockwise-rotation: 0
  # science pixel values for un-binned frames (binning handled in code)
  science-pixels:
    # NAXIS1 == x-axis
    columns:
      start: 50
      end: 858
    # NAXIS2 == y-axis
    rows:
      start: 0
      end: 4096
  # THE UNEXPOSED PRESCAN STRIP OF A RAW FRAME, IN THE SAME FORM AS science-pixels. A SCIENCE FRAME TAKES ITS READ NOISE
  # FROM IT (DY-2437). THE ROWS LEAVE OUT THE 50 AT EACH END OF THE READOUT
  prescan-pixels:
    columns:
      start: 8
      end: 46
    rows:
      start: 50
      end: 4046
  # DEFAULT BINNING [y, x]
  binning: [1, 1]
  gain: 1. # e/ADU
  ron: 3.80 # e
  saturation: 65535.
  bad-pixel map:
    1x1: BP_MAP_RP_VIS_1x1.fits
    1x2: BP_MAP_RP_VIS_1x2.fits
    2x1: BP_MAP_RP_VIS_2x1.fits
    2x2: BP_MAP_RP_VIS_2x2.fits
  predicted pinhole lines:
    single:
      1x1: SOXS_SPH_TAB_VIS_ThAr_1x1.fits
      2x1: SOXS_SPH_TAB_VIS_ThAr_2x1.fits
    multi:
      1x1: SOXS_MPH_TAB_VIS_ThAr_1x1.fits
      2x1: SOXS_MPH_TAB_VIS_ThAr_2x1.fits
  mid_slit_index: 4
  spectral format table: SOXS_SPECTRAL_FORMAT_TAB_VIS.fits
  slit_length: 12 #arcsec
  # WIDTH (ARCSEC) OF ONE SLIT ROW OF THE FULL-SLIT RECTIFIED GRID: THE MEDIAN PLATE SCALE OF THE ORDERS, PER UNBINNED PIXEL,
  # SO THE GRID IS THE SAME FOR EVERY FRAME. PROVISIONAL (DY-2364): MEDIAN OF THE PER-ORDER ARCSEC/PIXEL MEASURED FROM 4 VIS
  # 1x1 SPATIAL SOLUTIONS OF JANUARY 2026 (0.2721 TO 0.2726), AS image_transformer MEASURES IT FOR ITS ROW SCALE
  slit-step-arcsec: 0.272
  line-atlas: thar_murphy.fits
  dispersion-axis: x
  rotate-qc-plot: 90
  flip-qc-plot: 1
  extinction: extinction_lasilla.fits
  flux-standards: flux_standards.fits
  skylines: skylines.fits
  # THE TELLURIC ABSORPTION LINES OF THE STAR WHOSE SHIFT IS REPORTED AS THE TELL SHIFT QC (DY-1969). AN ARM OR INSTRUMENT WITHOUT THE KEY MEASURES NO SHIFT
  telluric-lines: telluric_lines.fits
  # PREDICTS THE u (ORDER 2) AND g (ORDER 3) DETECTOR SHIFTS FROM THE SKY-MEASURED r/i SHIFTS AND THE ROTATOR ANGLE (DY-1608)
  # dy_order = m*(dr+di)/2 + cos*(cos(th_sci)-cos(th_cal)) + sin*(sin(th_sci)-sin(th_cal))
  # px ALONG THE DISPERSION AXIS, SCIENCE MINUS CALIBRATION, POSITIVE = FEATURES MOVE TO LARGER PIXELS; th = ESO ADA ABSROT
  ug-wavelength-transfer:
    orders:
      2:
        m: -2.714
        cos: -4.624
        sin: -5.17
      3:
        m: -3.489
        cos: -5.233
        sin: -5.935
    fit_date: "2026-10-16"
    n_arcs: 72
    n_nights: 18
    absrot_range_deg: [-204.7, 186.9]
    source: "P32.11 hub output/rotated_mph_study/fit_transfer.py (72 VIS multi-pinhole arcs, leave-one-night-out rms u 0.96 px, g 1.14 px)"
  # PREDICTS THE r (ORDER 1) DETECTOR SHIFT FROM THE SKY-MEASURED i SHIFT AND THE ROTATOR ANGLE (DY-1645)
  # dy_r = i*di + cos*(cos(th_sci)-cos(th_cal)) + sin*(sin(th_sci)-sin(th_cal)); SAME CONVENTIONS AS ug-wavelength-transfer
  # rms_px IS THE LEAVE-ONE-NIGHT-OUT RMS OF THE PREDICTION
  r-from-i-transfer:
    i: 1.104
    cos: 0.554
    sin: -0.12
    rms_px: 0.364
    fit_date: "2026-10-19"
    n_arcs: 72
    n_nights: 18
    source: "P32.11 hub output/r_from_i_dy1645/fit_r_from_i.py (72 VIS multi-pinhole arcs, leave-one-night-out rms 0.364 px)"
  # THE LOG-WAVELENGTH STEP (km/s) OF THE MERGED-SPECTRUM GRID PER UNBINNED PIXEL; THE REDUCTION WILL MULTIPLY IT BY BINY (PLANNED, DY-2348, ADR 0003)
  # MEASURED 2026-11-26 BY tools/measure_log_wavelength_step.py AT soxspipe b40d6fbf ON PRODUCTS REDUCED AT 1bcac931, FROM 24 STARE FRAMES ON 5 NIGHTS: 2026-01-12, 2026-01-17, 2026-01-22, 2026-01-27 AND 2026-10-09
  # SMALLEST PER-ORDER MEDIAN STEP (ORDER 2); MEDIAN OVER NIGHTS 17.83, RAW MAD 0.00 (0.0 %); ADR 0003 PROVISIONAL VALUE 18, MEASURED -0.9 %
  log-wavelength-step-kms: 17.83
  # THE NOMINAL RESOLVING POWER R BY SLIT, MEASURED ON THE ThAr SLIT ARCS (DY-2378)
  # MEASURED 2026-11-26 BY tools/measure_spec_res.py AT soxspipe b40d6fbf (MAPS REDUCED AT 1bcac931), FROM 27 SLIT ARCS (9 PER SLIT) ON 5 NIGHTS: 2026-01-12, 2026-01-17, 2026-01-22, 2026-01-27 AND 2026-10-09
  # MEDIAN OVER NIGHTS OF THE PER-NIGHT MEDIAN R, RAW MAD (% OF MEDIAN): SLIT0.5 8782, 14 (0.2 %); SLIT1.0 4770, 8 (0.2 %); SLIT1.5 2811, 24 (0.9 %)
  # SLIT5.0 IS NOMINAL, NOT MEASURED: THE SLIT1.0 VALUE TIMES 1 / 5 (RAW MAD OF THE PER-NIGHT VALUES 2, 0.2 %)
  # SKY-LINE CROSS-CHECK, NOT IN THE TABLE AND NOT USABLE: 2 TO 23 LINES PER NIGHT AND SLIT, SKY/ARC 1.09 TO 5.01
  spec-res:
    SLIT0.5: 8782
    SLIT1.0: 4770
    SLIT1.5: 2811
    SLIT5.0: 954
  # THE UNCERTAINTY (nm) OF A WAVELENGTH SOLUTION NOT TUNED TO THE SKY LINES: THE LARGEST OVER ORDERS OF THE PER-ORDER RMS ABOUT ZERO OF THE MEASURED SKY SHIFTS (DY-2378)
  # MEASURED 2026-11-26 BY tools/measure_sky_shift_uncertainty.py AT soxspipe b40d6fbf, ON PRODUCTS REDUCED AT 1bcac931 (JANUARY AND 2026-10-09)
  # AND AT cc2d5258 PLUS AN UNCOMMITTED PATCH THAT REMOVES THE DY-1665 SKIP, SO ATTACHED-ARC FRAMES ARE TUNED (2026-06-30 TO 07-06). ORDERS WITH NO SKY-LINE MEASUREMENT ARE LEFT OUT
  # UNTUNED (POOLED, NO PER-NIGHT GATE: THE SHIFT DEPENDS ON THE ROTATOR ANGLE, DY-2458): 219 SHIFTS FROM 58 FRAMES ON 11 NIGHTS:
  # 2026-01-12, 2026-01-17, 2026-01-22, 2026-01-27, 2026-06-30, 2026-07-02, 2026-07-03, 2026-07-04, 2026-07-05, 2026-07-06 AND 2026-10-09;
  # ABSROT -185.1 TO +174.9 deg; POOLED RMS 0.0601 nm; PER ORDER O1 0.0548, O2 0.0477, O3 0.0581, O4 0.0754 nm
  # ATTACHED-ARC (POOLED WORST ORDER; PER-NIGHT GATE WAIVED, DY-2378): 25 SHIFTS FROM 7 FRAMES (6 ARE STANDARDS FILED AS SCIENCE) ON 5 NIGHTS:
  # 2026-06-30, 2026-07-02, 2026-07-03, 2026-07-04 AND 2026-07-06; ABSROT -182.4 TO +114.2 deg; POOLED RMS 0.0035 nm;
  # PER ORDER O1 0.0024, O2 0.0032, O3 0.0051, O4 0.0030 nm; PER-NIGHT MEDIAN 0.003 nm, RAW MAD 0.001 nm (33 %); THE SCATTER IS 2026-06-30, WHERE g
  # (FROM THE r/i MODEL, NOT SKY LINES) USES AN ARC WHOSE g SOLUTION IS KNOWN TO BE BAD
  sky-shift-uncertainty-nm:
    untuned: 0.0754
    attached-arc: 0.0051

NIR:
  # AMOUNT RAW-FRAMES NEED ROTATED BEFORE REDUCTION
  clockwise-rotation: 0
  # # science pixel values for un-binned frames (binning handled in code)
  science-pixels: 
    # NAXIS1 == x-axis
    columns:
      start: 4
      end: 2044
    # NAXIS2 == y-axis
    rows:
      start: 4
      end: 2044
  # # DEFAULT BINNING [y, x]
  binning: [1, 1]
  # saturation: 2.0e5
  gain: 2.3 # e/ADU. From commissioning report
  # THE FALLBACK READ NOISE (e-) FOR A FRAME WITH NO USABLE ESO DET NDSAMPLES CARD: THE 128-SAMPLE VALUE OF THE TABLE BELOW
  # (DY-2341). THE COMMISSIONING REPORT STATES 16.3 AND THE FORMER VALUE WAS 7.3. SEE soxs_mdark.py FOR DETAILS.
  ron: 7.55 # e
  # THE NIR READ NOISE (e-) BY NUMBER OF UP-THE-RAMP SAMPLES (ESO DET NDSAMPLES), LOOKED UP FROM EACH FRAME'S OWN HEADER AND
  # INTERPOLATED LINEARLY IN log(NDSAMPLES) BETWEEN THE POINTS. THE RANGE OF THE TABLE, 2 TO 128, IS THE RANGE OF THE LOOKUP
  # (DY-2341, MEASURED 2026-11-20 FROM 820 SETS OF RAW DARKS, ALL RR_Up-The-Ramp; ONE SET IS ONE NIGHT AT ONE EXPOSURE TIME
  # WITH AT LEAST 3 DARKS). EACH VALUE IS THE MEDIAN OVER THE GOOD NIGHTS OF THE DY-2322 STATISTIC: THE MAD SIGMA OF
  # CONSECUTIVE-PAIR DIFFERENCES DIVIDED BY SQRT(2), WITH THE SETTLING FIRST FRAME SKIPPED. THE DIT OF EACH POINT IS
  # 2, 5, 10, 15, 60, 120 AND 300 s; THE 128-SAMPLE POINT IS FROM THE 300 s DARKS ONLY. SCRIPT AND PER-SET RESULTS:
  # output/DY-2341/scripts/measure_ron.py AND output/DY-2341/results/ron_by_set.csv IN THE soxspipe WORKSPACE.
  # KNOWN LIMITS (ACCEPTED, DY-2341 RULING OF 2026-11-20): A SINGLE TABLE IGNORES (1) THE NIGHT-TO-NIGHT SCATTER OF ABOUT
  # +-15% AT 128 SAMPLES AND (2) A DRIFT OF ABOUT +20% AT THE SHORT END (2 TO 10 SAMPLES) OVER 2025-09 TO 2026-10. THE 39 AND
  # 77 SAMPLE POINTS COME FROM 3 NIGHTS IN MAY 2025 ONLY. NIGHTS WITH ZERO OR OVER 25 e- READ NOISE WERE EXCLUDED AS BAD.
  read-noise-by-ndsamples:
    2: 17.50
    4: 16.94
    7: 14.62
    10: 13.14
    39: 8.95
    77: 7.62
    128: 7.55
  bad-pixel map:
    1x1: BP_MAP_RP_NIR.fits
  predicted pinhole lines:
    single:
      #1x1: SOXS_SPH_TAB_NIR_Xe.fits
      # DY-2470: O11 HgI 1719.867 AND 1732.941 TAKE THEIR NIST OBSERVED VALUES, AS IN THE MULTI-PINHOLE TABLE
      1x1: ArHgNeXe_clean_within_2.0pixel.fits
    multi:
      # 1x1: SOXS_MPH_TAB_NIR_Xe.fits
      #1x1: Hg.fits
      # DY-1989: O10/O11 REBUILT FROM LINES CHECKED ON THE ARC; OTHER ORDERS AS ArHgNeXe_clean_within_2.0pixel.fits
      # DY-2084: XeI AND HgI WAVELENGTHS ARE NIST RITZ VALUES (THE ARC MEASURES RITZ, NOT NIST OBSERVED); POSITIONS UNCHANGED
      # (EXCEPT THE TWO O11 HgI LINES OF DY-2470 BELOW)
      # DY-2084: 7 MISIDENTIFIED SETS REMOVED (O13 1534.82 NeI AND 1534.88 Ar; ArII 1167.79 AND 1172.05 IN O16 AND O17, 1202.71 IN O16)
      # DY-2171: O10 GAINS NeI 1859.1540 AND 1862.5158 (NIST RITZ; NOT THE NeII 1862.734 OF THE CLEAN LIST) AND ArI 1981.7507
      # AND 1996.5729 (RITZ FROM THE NIST Ar I LEVELS; NIST ASD LISTS NO Ar I LINE THERE), ALL AS FULL 9-PINHOLE SETS
      # DY-2424: O10 ArI 1863.2289 AND 1874.5005 (REMOVED IN DY-2173) RESTORED AT THEIR NIST Ar I LEVEL-RITZ VALUES
      # DY-2470: O11 HgI 1719.828 AND 1732.896 (RITZ) MOVED TO THEIR NIST OBSERVED VALUES 1719.867 AND 1732.941, WHERE THE
      # ARC PUTS THEM (THE RITZ VALUES READ 0.4 A OFF); POSITIONS UNCHANGED
      1x1: SOXS_MPH_TAB_NIR_ArHgNeXe.fits
  mid_slit_index: 4
  spectral format table: SOXS_SPECTRAL_FORMAT_TAB_NIR.fits
  slit_length: 12 #arcsec
  # WIDTH (ARCSEC) OF ONE SLIT ROW OF THE FULL-SLIT RECTIFIED GRID: THE MEDIAN PLATE SCALE OF THE ORDERS, PER UNBINNED PIXEL,
  # SO THE GRID IS THE SAME FOR EVERY FRAME. PROVISIONAL (DY-2364): MEDIAN OF THE PER-ORDER ARCSEC/PIXEL MEASURED FROM 2 NIR
  # SPATIAL SOLUTIONS OF JANUARY 2026 (0.3273 AND 0.3290), AS image_transformer MEASURES IT FOR ITS ROW SCALE
  slit-step-arcsec: 0.329
  line-atlas: ArHgNeXe.fits
  dispersion-axis: y
  rotate-qc-plot: 0
  flip-qc-plot: 1
  extinction: extinction_lasilla.fits
  flux-standards: flux_standards.fits
  skylines: skylines.fits
  # THE TELLURIC ABSORPTION LINES OF THE STAR WHOSE SHIFT IS REPORTED AS THE TELL SHIFT QC (DY-1969). AN ARM OR INSTRUMENT WITHOUT THE KEY MEASURES NO SHIFT
  telluric-lines: telluric_lines.fits
  # THE FACTOR k BY WHICH THE MASTER FLAT'S ALONG-SLIT GRADIENT IS SCALED BEFORE THE SKY FIT DIVIDES IT OUT (DY-2150)
  # k = SKY SLOPE / FLAT-PREDICTED SLOPE, ROUNDED TO 0.05, FROM 16 NIR STARE FRAMES ON 4 SLITS AND 12 NIGHTS, JANUARY 2026
  # ORDERS 20 TO 22 ARE POORLY MEASURED. AN ORDER NOT LISTED USES k = 1: ORDERS 14 AND BELOW (THE FLAT UNDER-CORRECTS
  # THERE BY LESS THAN THE FRAME-TO-FRAME SCATTER) AND ORDERS 23 AND 24 (NO SKY MEASUREMENT). EACH k MUST BE ABOVE 0 AND AT
  # MOST 1, WHICH KEEPS THE SCALED PROFILE POSITIVE
  flat-slit-gradient-scale:
    15: 0.80
    16: 0.75
    17: 0.60
    18: 0.70
    19: 0.60
    20: 0.60
    21: 0.60
    22: 0.60
  # THE LOG-WAVELENGTH STEP (km/s) OF THE MERGED-SPECTRUM GRID PER UNBINNED PIXEL; THE REDUCTION WILL MULTIPLY IT BY BINX (PLANNED, DY-2348, ADR 0003)
  # MEASURED 2026-11-26 BY tools/measure_log_wavelength_step.py AT soxspipe b40d6fbf ON PRODUCTS REDUCED AT 1bcac931, FROM 24 STARE FRAMES ON 5 NIGHTS: 2026-01-12, 2026-01-17, 2026-01-22, 2026-01-27 AND 2026-10-09
  # SMALLEST PER-ORDER MEDIAN STEP (ORDER 10); MEDIAN OVER NIGHTS 13.16, RAW MAD 0.00 (0.0 %); ADR 0003 PROVISIONAL VALUE 11, MEASURED +19.6 %
  log-wavelength-step-kms: 13.16
  # THE NOMINAL RESOLVING POWER R BY SLIT, MEASURED ON THE ArHgNeXe SLIT ARCS (DY-2378)
  # MEASURED 2026-11-26 BY tools/measure_spec_res.py AT soxspipe b40d6fbf (MAPS REDUCED AT 1bcac931), FROM 18 SLIT ARCS (6 PER SLIT) ON 5 NIGHTS: 2026-01-12, 2026-01-17, 2026-01-22, 2026-01-27 AND 2026-10-09
  # MEDIAN OVER NIGHTS OF THE PER-NIGHT MEDIAN R, RAW MAD (% OF MEDIAN): SLIT0.5 10783, 15 (0.1 %); SLIT1.0 6147, 8 (0.1 %); SLIT1.5 3462, 10 (0.3 %)
  # SLIT5.0 IS NOMINAL, NOT MEASURED: THE SLIT1.0 VALUE TIMES 1 / 5 (RAW MAD OF THE PER-NIGHT VALUES 2, 0.2 %)
  # SKY-LINE CROSS-CHECK, NOT IN THE TABLE: AGREES WITH THE ARCS, SKY/ARC 1.01 TO 1.03 FROM 42 TO 359 LINES PER NIGHT AND SLIT
  spec-res:
    SLIT0.5: 10783
    SLIT1.0: 6147
    SLIT1.5: 3462
    SLIT5.0: 1229
  # THE UNCERTAINTY (nm) OF A WAVELENGTH SOLUTION NOT TUNED TO THE SKY LINES: THE LARGEST OVER ORDERS OF THE PER-ORDER RMS ABOUT ZERO OF THE MEASURED SKY SHIFTS (DY-2378)
  # MEASURED 2026-11-26 BY tools/measure_sky_shift_uncertainty.py AT soxspipe b40d6fbf, ON PRODUCTS REDUCED AT 1bcac931
  # UNTUNED (POOLED, NO PER-NIGHT GATE: THE SHIFT DEPENDS ON THE ROTATOR ANGLE, DY-2458): 435 SHIFTS FROM 29 FRAMES
  # ON 5 NIGHTS: 2026-01-12, 2026-01-17, 2026-01-22, 2026-01-27 AND 2026-10-09; ABSROT -89.5 TO +174.9 deg; POOLED RMS 0.1534 nm; THE VALUE IS SET BY ORDER 10 (O10 0.2191, O24 0.1136 nm)
  # ATTACHED-ARC IS NOT MEASURED, SO THE KEY IS LEFT OUT: NO NIR FRAME OF THE MEASURED NIGHTS HAS AN ATTACHED ARC (7 min AND 5 deg), AND THE
  # COMMISSIONING ARCHIVE HOLDS NO NON-STANDARD NIR NIGHT WITH ONE
  sky-shift-uncertainty-nm:
    untuned: 0.2191
