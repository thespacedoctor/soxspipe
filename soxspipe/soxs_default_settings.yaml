            # AN ORDER IS FAINT WHEN FEWER THAN THIS FRACTION OF ITS SAMPLES ARE DETECTED
            faint-order-min-detection-fraction: 0.5
            # AN ORDER IS FAINT WHEN THE MAD SCATTER OF ITS CENTRE SHIFT ABOUT A DEGREE-2 FIT EXCEEDS THIS (PIXELS)
            faint-order-max-scatter-px: 1.5
            # A FAINT ORDER CAN STILL ANCHOR ITS FAINT NEIGHBOUR WHEN IT IS DETECTED OFTEN ENOUGH AND ITS SCATTER IS AT MOST THIS (PIXELS)
            faint-order-max-anchor-scatter-px: 3.0
            # NUMBER OF WAVELENGTH BINS A FAINT ORDER IS COLLAPSED INTO
            faint-order-bin-count: 15
            # A BIN IS KEPT ONLY WHEN ITS PEAK SIGNAL-TO-NOISE RATIO IS AT LEAST THIS
            faint-order-min-bin-snr: 3.0
            # WARN WHEN ADJACENT ORDERS DISAGREE ON THE SLIT POSITION OF THE TRACE AT THEIR JOIN BY MORE THAN THIS (ARCSEC)
            same-source-max-join-arcsec: 2.0
