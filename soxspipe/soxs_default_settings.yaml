version: 1

# INTERMEDIATE DATA PRODUCTS CAN CONSUME A LOT OF STORAGE SPACE - BE WARNED
save-intermediate-products: False

# instrument the data belongs to; `xsh` or `soxs`
instrument: soxs
data-extension: 0

PAE: False
ignore-dflats: True
ignore-dome-flats: True

soxs-mbias:
    # INDIVIDUAL RAW BIAS FRAME CLIPPING PARAMETERS. DATA IS CLIPPED BEFORE STACKING.
    frame-clipping-sigma: 3 
    frame-clipping-iterations: 3
    # STACKED FRAME CLIPPING PARAMETERS. DATA IS CLIPPED AFTER STACKING.
    stacked-clipping-sigma: 4
    stacked-clipping-iterations: 3
    qc-acceptable-ranges:
        master-ron: [0,10]
        fpn-fracmax: [0,3]
        mbias-median: [0, 2000]
        raw-ron: [0,15]
        structx: [-5,+5]
        structy: [-0.8,0.8]
        detector-temp: [0,165]
        

soxs-mdark:
    # STACKED FRAME CLIPPING PARAMETERS. DATA IS CLIPPED DURING STACKING.
    stacked-clipping-sigma: 3
    stacked-clipping-iterations: 3
    # MASTER DARK FRAME CLIPPING PARAMETERS. 
    frame-clipping-sigma: 3 
    frame-clipping-iterations: 3
    qc-acceptable-ranges:
        mdark-median: [-15, 50]
        raw-ron: [0,30]
        detector-temp: [0,50]


soxs-disp-solution:
    vis:
        # SIZE OF STAMP USED TO IDENTIFY ARC-LINES IN PINHOLE IMAGE
        pixel-window-size: 12        
        # MINIMUM SIGNIFICANCE REQUIRED FOR ARC-LINE TO BE CONSIDERED 'DETECTED'
        pinhole-detection-thres-sigma: 2
        # DEGREE OF ORDER TERM WHEN FITTING DISPERSION SOLUTION POLYNOMIALS [X,Y]
        order-deg: [3,3]
        # DEGREE OF WAVELENGTH TERM WHEN FITTING DISPERSION SOLUTION POLYNOMIALS [X,Y]
        wavelength-deg: [5,5] 
        # NUMBER OF SIGMA-CLIPPING ITERATIONS TO PERFORM BEFORE SETTINGS ON A POLYNOMIAL FIT FOR THE DISPERSION SOLUTION
        poly-fitting-residual-clipping-sigma: 7
        # SIGMA CLIPPING LIMIT WHEN FITTING GLOBAL POLYNOMIAL TO THE DISPERSION SOLUTION
        poly-clipping-iteration-limit: 7
        # DROP A WHOLE MULTI-PINHOLE SET WHOSE MEDIAN SIGNED OFFSET (X OR Y) LIES MORE THAN THIS MANY MAD-SIGMA FROM THE ORDER'S MEDIAN SET OFFSET, TESTED ON THE FIRST FIT ONLY
        poly-clipping-set-offset-sigma: 5
        qc-acceptable-ranges:
            detlines-frac: [0.9,1.01]
            fwhm-pin-sd: [0.1,0.2]
            fwhm-pin-median: [1.60,1.75]
            x-diff-sd: [0,3.0]
            y-diff-sd: [0,10.0]
            x-res-median: [0.0,0.15]
            y-res-median: [0.0,0.9]
            x-res-sd: [0,0.4]
            y-res-sd: [0,1.2]
            xy-res-sd: [0,1.5]
            detector-temp: [0,165]
    nir:
        # SIZE OF STAMP USED TO IDENTIFY ARC-LINES IN PINHOLE IMAGE
        pixel-window-size: 12
        # MINIMUM SIGNIFICANCE REQUIRED FOR ARC-LINE TO BE CONSIDERED 'DETECTED'
        pinhole-detection-thres-sigma: 4
        # DEGREE OF ORDER TERM WHEN FITTING DISPERSION SOLUTION POLYNOMIALS [X,Y]
        order-deg: [5,3]
        # DEGREE OF WAVELENGTH TERM WHEN FITTING DISPERSION SOLUTION POLYNOMIALS [X,Y]
        wavelength-deg: [4,5] 
        # NUMBER OF SIGMA-CLIPPING ITERATIONS TO PERFORM BEFORE SETTINGS ON A POLYNOMIAL FIT FOR THE DISPERSION SOLUTION
        poly-fitting-residual-clipping-sigma: 5
        # SIGMA CLIPPING LIMIT WHEN FITTING GLOBAL POLYNOMIAL TO THE DISPERSION SOLUTION
        poly-clipping-iteration-limit: 5
        # DROP A WHOLE MULTI-PINHOLE SET WHOSE MEDIAN SIGNED OFFSET (X OR Y) LIES MORE THAN THIS MANY MAD-SIGMA FROM THE ORDER'S MEDIAN SET OFFSET, TESTED ON THE FIRST FIT ONLY
        poly-clipping-set-offset-sigma: 5
        qc-acceptable-ranges:
            detlines-frac: [0.9,1.01]
            fwhm-pin-sd: [0,0.211]
            fwhm-pin-median: [1.75,1.89]
            x-diff-sd: [0,1.3]
            y-diff-sd: [0,1.5]
            x-res-median: [0.0,0.35]
            y-res-median: [0.0,0.13]
            x-res-sd: [0,1.0]
            y-res-sd: [0,0.25]
            xy-diff-sd: [0,1.9]
            xy-diff-median: [0,6.0]
            xy-res-sd: [0,1.0]
            xy-res-median: [0,0.4]
            detector-temp: [0,50]

soxs-order-centres:
    vis:
        detect-continuum:
            # NUMBER OF CROSS-ORDER SLICES PER ORDER
            order-sample-count: 100
            # LENGTH OF EACH SLICE (PIXELS)
            slice-length: 30
            # WIDTH OF EACH SLICE (PIXELS)
            slice-width: 3
            # HEIGHT GAUSSIAN PEAK MUST BE ABOVE MEDIAN FLUX TO BE "DETECTED" BY CODE (STD VIA MEDIAN ABSOLUTE DEVIATION).
            peak-sigma-limit: 5.
            # WARN WHEN THE FITTED TRACE OF AN ORDER IS EXTRAPOLATED ACROSS MORE THAN THIS FRACTION OF THE ORDER WITH NO ACCEPTED SAMPLE
            max-unsampled-trace-fraction: 0.2
            # DEGREE OF Y-COMPONENT OF GLOBAL POLYNOMIAL FIT TO ORDER CENTRES
            disp-axis-deg: 5
            # DEGREE OF ORDER-COMPONENT OF GLOBAL POLYNOMIAL FIT TO ORDER CENTRES
            order-deg: 3
            # SIGMA CLIPPING LIMIT WHEN FITTING GLOBAL POLYNOMIAL TO ORDER CENTRES
            poly-fitting-residual-clipping-sigma: 7
            # MAXIMUM NUMBER OF CLIPPING ITERATIONS WHEN FITTING GLOBAL POLYNOMIAL TO ORDER CENTRES
            poly-clipping-iteration-limit: 5
        qc-acceptable-ranges:
            detector-temp: [0,165]
            samples-det-frac: [0.85,1.01]
            x-res-sd: [0,0.1]
    nir:
        detect-continuum:
            # NUMBER OF CROSS-ORDER SLICES PER ORDER
            order-sample-count: 100
            # LENGTH OF EACH SLICE (PIXELS)
            slice-length: 30
            # WIDTH OF EACH SLICE (PIXELS)
            slice-width: 3
            # HEIGHT GAUSSIAN PEAK MUST BE ABOVE MEDIAN FLUX TO BE "DETECTED" BY CODE (STD VIA MEDIAN ABSOLUTE DEVIATION).
            peak-sigma-limit: 5.
            # WARN WHEN THE FITTED TRACE OF AN ORDER IS EXTRAPOLATED ACROSS MORE THAN THIS FRACTION OF THE ORDER WITH NO ACCEPTED SAMPLE
            max-unsampled-trace-fraction: 0.2
            # DEGREE OF Y-COMPONENT OF GLOBAL POLYNOMIAL FIT TO ORDER CENTRES
            disp-axis-deg: 5
            # DEGREE OF ORDER-COMPONENT OF GLOBAL POLYNOMIAL FIT TO ORDER CENTRES
            order-deg: 6
            # SIGMA CLIPPING LIMIT WHEN FITTING GLOBAL POLYNOMIAL TO ORDER CENTRES
            poly-fitting-residual-clipping-sigma: 7
            # MAXIMUM NUMBER OF CLIPPING ITERATIONS WHEN FITTING GLOBAL POLYNOMIAL TO ORDER CENTRES
            poly-clipping-iteration-limit: 5
        qc-acceptable-ranges:
            detector-temp: [0,50]
            samples-det-frac: [0.80,1.01]
            y-res-sd: [0,0.1]

soxs-mflat:
    # FIT AND SUBTRACT THE INTRA-ORDER BACKGROUND LIGHT
    subtract_background: True
    # STACKED FRAME CLIPPING PARAMETERS. DATA IS CLIPPED DURING STACKING.
    stacked-clipping-sigma: 15
    stacked-clipping-iterations: 3
    # VIS TUNED USING ORDER-CENTRE POLY DEGS
    vis:
        # SIZE OF THE WINDOW (IN PIXELS) USED TO MEASURE FLUX IN THE CENTRAL BAND TO DETERMINE MEDIAN EXPOSURE
        centre-order-window: 10
        # LENGTH OF THE CROSS_DISPERSION SLICES USED TO DETERMINE ORDER EDGES
        slice-length-for-edge-detection: 70
        # WIDTH OF THE CROSS_DISPERSION SLICES USED TO DETERMINE ORDER EDGES
        slice-width-for-edge-detection: 5
        # MINIMUM VALUE FLUX CAN DROP TO AS PERCENTAGE OF CENTRAL FLUX AND BE COUNTED AS AN ORDER EDGE
        min-percentage-threshold-for-edge-detection: 20
        # MAXIMUM VALUE FLUX CAN CLIMB TO AS PERCENTAGE OF CENTRAL FLUX AND BE COUNTED AS AN ORDER EDGE
        max-percentage-threshold-for-edge-detection: 50
        # DEGREE OF Y-COMPONENT OF GLOBAL POLYNOMIAL FIT TO ORDER EDGES
        disp-axis-deg: 3
        # DEGREE OF ORDER-COMPONENT OF GLOBAL POLYNOMIAL FIT TO ORDER EDGES
        order-deg: 3
        # SIGMA CLIPPING LIMIT WHEN FITTING GLOBAL POLYNOMIAL TO ORDER EDGES
        poly-fitting-residual-clipping-sigma: 5
        # MAXIMUM NUMBER OF CLIPPING ITERATIONS WHEN FITTING GLOBAL POLYNOMIAL TO ORDER EDGES
        poly-clipping-iteration-limit: 2
        # PIXELS WITH A FLUX LESS THAN THIS MANY SIGMA (MAD) BELOW THE MEDIAN FLUX LEVEL ADDED TO THE BP MAP
        low-sensitivity-clipping-sigma: 2
        # RELATIVE-LOW-FLAT RULE AIMED AT PARTLY ILLUMINATED ORDER-EDGE PIXELS: ANY IN-ORDER PIXEL BELOW THIS FRACTION OF ITS ORDER-ROW MEDIAN IS ADDED TO THE BP MAP. 0 TURNS THIS OFF
        order-edge-min-flat-fraction: 0.5
        qc-acceptable-ranges:
            detector-temp: [0,165]
            inner-order-pix-mean: [0.9,1.1]
            inner-order-pix-sum: [100000,700000]
            ordexp90: [10000,150000]
            x-res-sd: [0,0.37]
            coldpix-frac: [-0.001,0.01]
    nir:
        # SIZE OF THE WINDOW (IN PIXELS) USED TO MEASURE FLUX IN THE CENTRAL BAND TO DETERMINE MEDIAN EXPOSURE 
        centre-order-window: 10
        # LENGTH OF THE CROSS_DISPERSION SLICES USED TO DETERMINE ORDER EDGES
        slice-length-for-edge-detection: 70
        # WIDTH OF THE CROSS_DISPERSION SLICES USED TO DETERMINE ORDER EDGES
        slice-width-for-edge-detection: 5
        # MINIMUM VALUE FLUX CAN DROP TO AS PERCENTAGE OF CENTRAL FLUX AND BE COUNTED AS AN ORDER EDGE
        min-percentage-threshold-for-edge-detection: 20
        # MAXIMUM VALUE FLUX CAN CLIMB TO AS PERCENTAGE OF CENTRAL FLUX AND BE COUNTED AS AN ORDER EDGE
        max-percentage-threshold-for-edge-detection: 50
        # DEGREE OF Y-COMPONENT OF GLOBAL POLYNOMIAL FIT TO ORDER EDGES
        disp-axis-deg: 5
        # DEGREE OF ORDER-COMPONENT OF GLOBAL POLYNOMIAL FIT TO ORDER EDGES
        order-deg: 6
        # SIGMA CLIPPING LIMIT WHEN FITTING GLOBAL POLYNOMIAL TO ORDER EDGES
        poly-fitting-residual-clipping-sigma: 3
        # MAXIMUM NUMBER OF CLIPPING ITERATIONS WHEN FITTING GLOBAL POLYNOMIAL TO ORDER EDGES
        poly-clipping-iteration-limit: 2
        # PIXELS WITH A FLUX LESS THAN THIS MANY SIGMA (MAD) BELOW THE MEDIAN FLUX LEVEL ADDED TO THE BP MAP
        low-sensitivity-clipping-sigma: 2
        # RELATIVE-LOW-FLAT RULE AIMED AT PARTLY ILLUMINATED ORDER-EDGE PIXELS: ANY IN-ORDER PIXEL BELOW THIS FRACTION OF ITS ORDER-ROW MEDIAN IS ADDED TO THE BP MAP. 0 TURNS THIS OFF
        order-edge-min-flat-fraction: 0.5
        qc-acceptable-ranges:
            detector-temp: [0,50]
            inner-order-pix-mean: [0.9,1.1]
            x-res-sd: [0,0.2]
            ordexp90: [30000,60000]
            inner-order-pix-sum: [1000000,1200000]
            coldpix-frac: [-0.001,0.01]


soxs-spat-solution:
    # DIVIDE IMAGE BY MASTER FLAT FRAME
    use_flat: False
    # FIT AND SUBTRACT THE INTRA-ORDER BACKGROUND LIGHT
    subtract_background: False
    vis:
        # THE SIZE OF THE SQUARE WINDOW USED TO SEARCH FOR AN ARC-LAMP EMISSION LINE, CENTRED ON THE PREDICTED PIXEL POSITION OF THE LINE
        pixel-window-size: 15
        # MINIMUM SIGNIFICANCE REQUIRED FOR ARC-LINE TO BE CONSIDERED 'DETECTED'
        pinhole-detection-thres-sigma: 2
        # DEGREE OF ECHELLE ORDER NUMBER COMPONENT OF GLOBAL POLYNOMIAL FIT TO THE DISPERSION SOLUTION [X, Y]
        order-deg: [3,3]
        # DEGREE OF WAVELENGTH COMPONENT OF GLOBAL POLYNOMIAL FIT TO THE DISPERSION SOLUTION [X, Y]
        wavelength-deg: [5,5]
        # DEGREE OF SLIT POSITION COMPONENT OF GLOBAL POLYNOMIAL FIT TO THE DISPERSION SOLUTION [X, Y]
        slit-deg: [1,1]
        # NUMBER OF SIGMA-CLIPPING ITERATIONS TO PERFORM BEFORE SETTINGS ON A POLYNOMIAL FIT FOR THE DISPERSION SOLUTION
        poly-clipping-iteration-limit: 7
        poly-fitting-residual-clipping-sigma: 7
        # CLIPPING PERFORMED ON MULTI-PINHOLE SETS (TRUE) OR INDIVIDUAL PINHOLES (FALSE)
        poly-clipping-pinhole-sets: False
        # DROP A WHOLE MULTI-PINHOLE SET WHOSE MEDIAN SIGNED OFFSET (X OR Y) LIES MORE THAN THIS MANY MAD-SIGMA FROM THE ORDER'S MEDIAN SET OFFSET, TESTED ON THE FIRST FIT ONLY
        poly-clipping-set-offset-sigma: 5
        # MAXIMUM DISTANCE ALLOWED FROM THE PIXEL CENTRE WHEN CALCULATING WAVELENGTH, ORDER AND SLIT-POSITION FOR 2D DISP-SOL IMAGE
        map_to_image_displacement_threshold: 0.01 # in pixels
        # FULL MULTI-PINHOLES SETS (SAME ARC LINE) WITH FEWER THAN MPH_LINE_SET_MIN LINES DETECTED GET CLIPPED
        mph_line_set_min: 7
        qc-acceptable-ranges:
            detector-temp: [0,165]
            detlines-frac: [0.95,1.01]
            goodlines-frac: [0.55,1.01]
            pinhole-count-min: [7.5,9.5]
            fwhm-pin-median: [1.60,1.72]
            fwhm-pin-sd: [0.0,0.16]
            xy-res-median: [0,0.7]
            xy-res-sd: [0,0.5]
            x-res-sd: [0,0.25]
            y-res-sd: [0,0.48]
    nir:
        # THE SIZE OF THE SQUARE WINDOW USED TO SEARCH FOR AN ARC-LAMP EMISSION LINE, CENTRED ON THE PREDICTED PIXEL POSITION OF THE LINE
        pixel-window-size: 10
        # MINIMUM SIGNIFICANCE REQUIRED FOR ARC-LINE TO BE CONSIDERED 'DETECTED'
        pinhole-detection-thres-sigma: 5
        # DEGREE OF ECHELLE ORDER NUMBER COMPONENT OF GLOBAL POLYNOMIAL FIT TO THE DISPERSION SOLUTION [X, Y]
        order-deg: [4,4]
        # DEGREE OF WAVELENGTH COMPONENT OF GLOBAL POLYNOMIAL FIT TO THE DISPERSION SOLUTION [X, Y]
        wavelength-deg: [5,4]
        # DEGREE OF SLIT POSITION COMPONENT OF GLOBAL POLYNOMIAL FIT TO THE DISPERSION SOLUTION [X, Y]
        slit-deg: [1,2]
        # NUMBER OF SIGMA-CLIPPING ITERATIONS TO PERFORM BEFORE SETTINGS ON A POLYNOMIAL FIT FOR THE DISPERSION SOLUTION
        poly-fitting-residual-clipping-sigma: 7
        # SIGMA CLIPPING LIMIT WHEN FITTING GLOBAL POLYNOMIAL TO THE DISPERSION SOLUTION
        poly-clipping-iteration-limit: 5
        # CLIPPING PERFORMED ON MULTI-PINHOLE SETS (TRUE) OR INDIVIDUAL PINHOLES (FALSE)
        poly-clipping-pinhole-sets: False
        # DROP A WHOLE MULTI-PINHOLE SET WHOSE MEDIAN SIGNED OFFSET (X OR Y) LIES MORE THAN THIS MANY MAD-SIGMA FROM THE ORDER'S MEDIAN SET OFFSET, TESTED ON THE FIRST FIT ONLY
        poly-clipping-set-offset-sigma: 5
        # MAXIMUM DISTANCE ALLOWED FROM THE PIXEL CENTRE WHEN CALCULATING WAVELENGTH, ORDER AND SLIT-POSITION FOR 2D DISP-SOL IMAGE
        map_to_image_displacement_threshold: 0.01 # in pixels
        # FULL MULTI-PINHOLES SETS (SAME ARC LINE) WITH FEWER THAN MPH_LINE_SET_MIN LINES DETECTED GET CLIPPED
        mph_line_set_min: 7
        qc-acceptable-ranges:
            detector-temp: [0,50]
            # # detlines-frac: [0.97,1.01]?
            pinhole-count-min: [8.5,9.5]
            fwhm-pin-median: [1.55,1.85]
            fwhm-pin-sd: [0.0,0.145]
            goodlines-frac: [0.4,1.01]
            # xy-diff-sd: [0,0.8]
            xy-res-median: [0,0.3]
            xy-res-sd: [0,0.5]
            x-res-sd: [0,0.42]
            y-res-sd: [0,0.2]
            # x-diff-sd:  [0,0.7]
            # y-diff-sd:  [0,0.7]
    
bootstrap_dispersion_solution: False


soxs-stare-std:
    # STACK ALL OBJECT FRAMES OF THE SOF BEFORE EXTRACTION. SET TO False TO EXTRACT EACH FRAME ON ITS OWN
    # (FLUX STANDARDS ARE ALWAYS STACKED)
    stack_before_extraction: True
    # DIVIDE IMAGE BY MASTER FLAT FRAME
    use_flat: True
    # FIT AND SUBTRACT THE INTRA-ORDER BACKGROUND LIGHT
    subtract_background: True
    # STACKED FRAME CLIPPING PARAMETERS. DATA IS CLIPPED DURING STACKING.
    stacked-clipping-sigma: 15
    stacked-clipping-iterations: 3
    # USE LA COSMIC TO REMOVE CRHs BEFORE EXTRACTION
    use_lacosmic: True 
    vis:
        # LA COSMIC SIGMA CLIPPING LIMIT
        lacosmic-sigma: 25
        # THE LENGTH OF THE 'SLIT' USED TO COLLECT OBJECT FLUX (IN PIXELS)
        horne-extraction-slit-length: 15
        # DEGREE OF THE POLYNOMIAL USED TO FIT THE DISPERSION-DIRECTION PROFILES OF THE OBJECT
        horne-extraction-profile-poly-order: 7
        # SIGMA CLIPPING LIMIT WHEN FITTING THE OBJECT PROFILE (GLOBAL OVER THE ORDER)
        horne-extraction-profile-global-clipping-sigma: 25
        # SIGMA CLIPPING LIMIT WHEN FITTING THE DISPERSION-DIRECTION PROFILES OF THE OBJECT
        horne-extraction-profile-clipping-sigma: 3.0
         # MAXIMUM NUMBER OF CLIPPING ITERATIONS WHEN FITTING DISPERSION-DIRECTION PROFILES
        horne-extraction-profile-clipping-iteration-count: 10
        detect-continuum:
            # NUMBER OF CROSS-ORDER SLICES PER ORDER
            order-sample-count: 150
            # LENGTH OF EACH SLICE (PIXELS)
            slice-length: 70
            # WIDTH OF EACH SLICE (PIXELS)
            slice-width: 7
            # HEIGHT GAUSSIAN PEAK MUST BE ABOVE MEDIAN FLUX TO BE "DETECTED" BY CODE (STD VIA MEDIAN ABSOLUTE DEVIATION).
            peak-sigma-limit: 1.5
            # WARN WHEN THE FITTED TRACE OF AN ORDER IS EXTRAPOLATED ACROSS MORE THAN THIS FRACTION OF THE ORDER WITH NO ACCEPTED SAMPLE
            max-unsampled-trace-fraction: 0.2
            # DEGREE OF Y-COMPONENT OF GLOBAL POLYNOMIAL FIT TO ORDER CENTRES
            disp-axis-deg: 5
            # DEGREE OF ORDER-COMPONENT OF GLOBAL POLYNOMIAL FIT TO ORDER CENTRES
            order-deg: 3
            # CLIPPING LIMIT (MEDIAN AND MAD) WHEN FITTING GLOBAL POLYNOMIAL TO OBJECT TRACE
            poly-fitting-residual-clipping-sigma: 4
            # MAXIMUM NUMBER OF CLIPPING ITERATIONS WHEN FITTING GLOBAL POLYNOMIAL TO ORDER CENTRES
            poly-clipping-iteration-limit: 5
        slit-illumination:
            # MEASURE THE ALONG-SLIT OFFSET OF EACH ORDER'S SKY IMAGE FROM THE MASTER FLAT'S AND MASK THE SLIT ENDS THAT ARE NOT LIT IN BOTH
            measure-offset: True
            # HOW FAR INSIDE THE BOTH-LIT SLIT RANGE THE MASK EDGES SIT (ARCSEC)
            overlap-margin-arcsec: 0.3
            # SLIT BIN WIDTH OF THE SKYLINE PROFILES (ARCSEC)
            profile-bin-arcsec: 0.1
            # LARGEST ORDER OFFSET ACCEPTED (ARCSEC)
            max-offset-arcsec: 3.0
            # LARGEST UNCERTAINTY ON A FITTED ORDER OFFSET ACCEPTED (ARCSEC)
            max-order-scatter-arcsec: 0.3
            # WAVELENGTH CHUNKS EACH ORDER IS SPLIT INTO TO BUILD THE SKY-CONTINUUM SLIT PROFILE OF AN ORDER WITH NO LINES IN THE SKYLINE TABLE (SOXS VIS U AND G) OR WITH EVERY SKYLINE BLENDED OR TOO CLOSE TO THE END OF THE ORDER
            continuum-chunks: 20
            # FEWEST CHUNKS A SLIT BIN OF THE CONTINUUM PROFILE NEEDS
            continuum-min-chunks-per-bin: 5
            # BINS WITHIN THIS DISTANCE OF THE OBJECT ARE LEFT OUT OF THE CONTINUUM PROFILE (ARCSEC)
            continuum-object-mask-arcsec: 2.5
            # LARGEST DIFFERENCE BETWEEN THE OFFSETS OF THE BLUE AND RED HALVES OF AN ORDER THAT STILL ACCEPTS ITS CONTINUUM OFFSET (ARCSEC)
            continuum-halves-max-diff-arcsec: 0.15
        sky-subtraction:
            # MODEL AND SUBTRACT THE SKY BEFORE OBJECT EXTRACTION
            subtract_sky: True
            # PERCENTILE CLIPPING SIGMA LIMIT USED TO CLIP THE OBJECT(S) BEFORE FITTING A SKY MODEL
            percentile_clipping_sigma: 2
            # MAXIMUM NUMBER OF CLIPPING ITERATIONS USED TO REMOVE THE OBJECT(S) BEFORE FITTING A SKY MODEL
            percentile_clipping_iterations: 15 
            # THE SIZE OF THE ROLLING WINDOW (IN PIXELS) USED TO PERCENTILE SMOOTH THE SKY SPECTRUM
            percentile_rolling_window_size: 35
            # FRACTION OF SLIT RANGE TO MASK AT UPPER AND LOWER SLIT EDGES. NOT APPLIED TO ORDERS THE SLIT-ILLUMINATION MASK COVERS
            clip-slit-edge-fraction: 0.07
            # AGGRESSIVELY MASK REGIONS NEAR THE OBJECT TRACE
            aggressive_object_masking: True
            # SUBTRACT A MODEL OF THE OBJECT'S WINGS FROM THE SKY PIXELS AND REFIT THE SKY, SO OBJECT LIGHT STAYS OUT OF THE SKY MODEL (DY-1279)
            object_wing_correction: True
            # CORRECT AN ORDER ONLY WHEN THE OBJECT LIGHT IN ITS SKY MODEL IS ABOVE THIS FRACTION OF THE SKY LEVEL
            object_wing_gate_fraction: 0.1
            # THE ORDER OF THE BSPLINE USED TO FIT THE SKY SPECTRUM
            bspline_order: 3
            # WHEN FITTING BSPLINE TO SKY DATA, ADD A MINIMUM SET OF KNOTS BEFORE ADDING MORE WHERE NEEDED
            starting_points_per_knot: 1000   
            # CAN NOT ADD ANOTHER KNOT TO A GROUP OF DATA POINTS SMALLER THAN min_points_per_knot (WHEN FITTING BSPLINE)
            min_points_per_knot: 155
            # THE SIZE OF THE ROLLING WINDOW (IN PIXELS) USED TO DETERMINE IF THE SKY-DATA RESIDUALS ARE JUST NOISE (EDGE OF ORDERS) 
            noise_rolling_window_size: 250
            # SIGNIFICANCE OF THE LOCAL ROLLING WINDOW RESIDUAL VALUE COMPARED TO THE GLOBAL RESIDUALS - TO DETERMINE IF WE ARE JUST LOOKING AT NOISE
            noise_sigma: 5
            # WHEN FITTING THE BSPLINE TO THE DATA, CLIP DEVIANT DATA POINTS BEFORE REFITTING WITH THIS SIGMA LIMIT
            bspline_fitting_residual_clipping_sigma: 10
            # NUMBER OF ITERATIONS USED TO FIT THE BSPLINE
            bspline_iteration_limit: 25
            # THE RESIDUAL FLOOR USED TO DETERMINE IF MORE KNOTS ARE NEEDED DURING BSPLINE FITTING
            residual_floor_percentile: 90
            # SAVE SKY-MODEL QC PLOT (EXPENSIVE)
            sky_model_qc_plot: False
    nir:
        # LA COSMIC SIGMA CLIPPING LIMIT
        lacosmic-sigma: 25
        # THE LENGTH OF THE 'SLIT' USED TO COLLECT OBJECT FLUX (IN PIXELS)
        horne-extraction-slit-length: 15
        # DEGREE OF THE POLYNOMIAL USED TO FIT THE DISPERSION-DIRECTION PROFILES OF THE OBJECT
        horne-extraction-profile-poly-order: 7
        # SIGMA CLIPPING LIMIT WHEN FITTING THE OBJECT PROFILE (GLOBAL OVER THE ORDER)
        horne-extraction-profile-global-clipping-sigma: 25
        # SIGMA CLIPPING LIMIT WHEN FITTING THE DISPERSION-DIRECTION PROFILES OF THE OBJECT
        horne-extraction-profile-clipping-sigma: 3.0
         # MAXIMUM NUMBER OF CLIPPING ITERATIONS WHEN FITTING DISPERSION-DIRECTION PROFILES
        horne-extraction-profile-clipping-iteration-count: 10
        detect-continuum:
            # NUMBER OF CROSS-ORDER SLICES PER ORDER
            order-sample-count: 150
            # LENGTH OF EACH SLICE (PIXELS)
            slice-length: 50
            # WIDTH OF EACH SLICE (PIXELS)
            slice-width: 7
            # HEIGHT GAUSSIAN PEAK MUST BE ABOVE MEDIAN FLUX TO BE "DETECTED" BY CODE (STD VIA MEDIAN ABSOLUTE DEVIATION).
            peak-sigma-limit: 1.5
            # WARN WHEN THE FITTED TRACE OF AN ORDER IS EXTRAPOLATED ACROSS MORE THAN THIS FRACTION OF THE ORDER WITH NO ACCEPTED SAMPLE
            max-unsampled-trace-fraction: 0.2
            # DEGREE OF ORDER-COMPONENT OF GLOBAL POLYNOMIAL FIT TO OBJECT TRACE
            order-deg: 4
            # DEGREE OF Y-COMPONENT OF GLOBAL POLYNOMIAL FIT TO OBJECT TRACE
            disp-axis-deg: 4
