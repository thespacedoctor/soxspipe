soxs-response:
    vis:
        # WIDTH (NM) OF THE WAVELENGTH BINS THE RAW RESPONSE IS MEDIAN-COMBINED INTO BEFORE FITTING
        bin_width_nm: 2
        # SPACING (NM) OF THE REGULAR INTERIOR KNOTS OF THE CUBIC SPLINE FITTED TO THE LOG RESPONSE. WITH A SMOOTHING PENALTY THE KNOTS ARE A DENSE REGULAR GRID
        knot_spacing_nm: 40
        # DIMENSIONLESS WEIGHT OF THE SECOND-DIFFERENCE PENALTY ON THE SPLINE COEFFICIENTS. 0 FITS THE PLAIN LEAST-SQUARES SPLINE; ABOVE 0 THE CURVE TENDS TO A STRAIGHT LINE IN LOG WHERE NO BINS CONSTRAIN IT
        smoothing_penalty: 0
        # BINS MORE THAN THIS MANY ROBUST SIGMA BELOW THE SPLINE (LOG SPACE) ARE CLIPPED
        clip_sigma_low: 4
        # BINS MORE THAN THIS MANY ROBUST SIGMA ABOVE THE SPLINE (LOG SPACE) ARE CLIPPED. ABSORPTION RAISES THE RESPONSE, SO THIS IS THE TIGHTER LIMIT
        clip_sigma_high: 3
        # MAXIMUM NUMBER OF CLIPPING ITERATIONS
        max_iteration: 10
        # BINS WITH FEWER SAMPLES THAN THIS ARE DROPPED
        min_bin_samples: 5
        # TELLURIC ABSORPTION REGIONS [LOWER, UPPER] (NM) EXCLUDED FROM THE FIT
        telluric_regions: [[686, 697], [716, 735], [758, 772], [810, 835]]
        # FURTHEST DISTANCE (NM) FROM A TELLURIC REGION EDGE THAT RAISED WING BINS ARE DROPPED FROM THE FIT. 0 DISABLES WING GROWTH
        telluric_wing_max_nm: 0
        # WIDTH (NM) OF THE REFERENCE WINDOW, BEYOND THE WING REACH, THAT DEFINES THE CONTINUUM NEXT TO A TELLURIC REGION
        telluric_wing_ref_nm: 30
        # MINIMUM RISE (LOG UNITS) ABOVE THAT CONTINUUM FOR A BIN TO COUNT AS TELLURIC WING
        telluric_wing_threshold: 0.05
        # STELLAR LINE CENTRES (NM) EXCLUDED FROM THE FIT
        stellar_lines: [383.5, 388.9, 397.0, 410.2, 434.0, 447.1, 486.1, 587.6, 656.3, 667.8]
        # HALF WIDTH (NM) EXCLUDED AROUND EACH STELLAR LINE
        line_half_width_nm: 2.5
        # BANDS [LOWER, UPPER] (NM) IN WHICH THE SELF-CALIBRATION RESIDUAL IS MEASURED (QC)
        selfcal_bands: [[350, 370], [370, 400], [400, 450], [500, 600], [780, 840]]
        # QC TOLERANCE: MAXIMUM FRACTION OF BINS CLIPPED
        clip_frac_max: 0.15
        # QC TOLERANCE: MAXIMUM WIDTH (NM) OF A STRETCH INSIDE THE DATA WITHOUT A KEPT BIN
        max_gap_nm_max: 40
        # QC TOLERANCE: MAXIMUM ABSOLUTE MEDIAN SELF-CALIBRATION RESIDUAL IN A BAND
        selfcal_res_max: 0.05
    nir:
        # WIDTH (NM) OF THE WAVELENGTH BINS THE RAW RESPONSE IS MEDIAN-COMBINED INTO BEFORE FITTING
        bin_width_nm: 5
        # SPACING (NM) OF THE REGULAR INTERIOR KNOTS OF THE CUBIC SPLINE FITTED TO THE LOG RESPONSE. WITH A SMOOTHING PENALTY THE KNOTS ARE A DENSE REGULAR GRID
        knot_spacing_nm: 30
        # DIMENSIONLESS WEIGHT OF THE SECOND-DIFFERENCE PENALTY ON THE SPLINE COEFFICIENTS. 0 FITS THE PLAIN LEAST-SQUARES SPLINE; ABOVE 0 THE CURVE TENDS TO A STRAIGHT LINE IN LOG WHERE NO BINS CONSTRAIN IT
        smoothing_penalty: 1
        # BINS MORE THAN THIS MANY ROBUST SIGMA BELOW THE SPLINE (LOG SPACE) ARE CLIPPED
        clip_sigma_low: 4
        # BINS MORE THAN THIS MANY ROBUST SIGMA ABOVE THE SPLINE (LOG SPACE) ARE CLIPPED. ABSORPTION RAISES THE RESPONSE, SO THIS IS THE TIGHTER LIMIT
        clip_sigma_high: 2.5
        # MAXIMUM NUMBER OF CLIPPING ITERATIONS
        max_iteration: 10
        # BINS WITH FEWER SAMPLES THAN THIS ARE DROPPED
        min_bin_samples: 5
        # TELLURIC ABSORPTION REGIONS [LOWER, UPPER] (NM) EXCLUDED FROM THE FIT
        telluric_regions: [[890, 980], [1095, 1175], [1305, 1500], [1780, 1975], [1995, 2028]]
        # FURTHEST DISTANCE (NM) FROM A TELLURIC REGION EDGE THAT RAISED WING BINS ARE DROPPED FROM THE FIT. 0 DISABLES WING GROWTH
        telluric_wing_max_nm: 30
        # WIDTH (NM) OF THE REFERENCE WINDOW, BEYOND THE WING REACH, THAT DEFINES THE CONTINUUM NEXT TO A TELLURIC REGION
        telluric_wing_ref_nm: 30
        # MINIMUM RISE (LOG UNITS) ABOVE THAT CONTINUUM FOR A BIN TO COUNT AS TELLURIC WING
        telluric_wing_threshold: 0.05
        # STELLAR LINE CENTRES (NM) EXCLUDED FROM THE FIT
        stellar_lines: [1005.0, 1094.1, 1282.2, 1875.6, 2166.1]
        # HALF WIDTH (NM) EXCLUDED AROUND EACH STELLAR LINE
        line_half_width_nm: 5
        # BANDS [LOWER, UPPER] (NM) IN WHICH THE SELF-CALIBRATION RESIDUAL IS MEASURED (QC)
        selfcal_bands: [[1000, 1080], [1520, 1750], [1975, 1995], [2024, 2035]]
        # QC TOLERANCE: MAXIMUM FRACTION OF BINS CLIPPED
        clip_frac_max: 0.15
        # QC TOLERANCE: MAXIMUM WIDTH (NM) OF A STRETCH INSIDE THE DATA WITHOUT A KEPT BIN
        max_gap_nm_max: 270
        # QC TOLERANCE: MAXIMUM ABSOLUTE MEDIAN SELF-CALIBRATION RESIDUAL IN A BAND
        selfcal_res_max: 0.05

# UTILS
background-subtraction:
    bspline-deg: 2
    gaussian-blur-sigma: 65


logging settings:
    formatters:
        file_style:
            format: '%(asctime)s %(levelname)s: "%(pathname)s", line %(lineno)d, in %(funcName)s > %(message)s'
            datefmt: '%Y/%m/%d %H:%M:%S'
        console_style:
            format: '%(levelname)s: "%(pathname)s", line %(lineno)d, in %(funcName)s > %(message)s'
            datefmt: '%H:%M:%S'
        html_style:
            format: '<div id="row" class="%(levelname)s"><span class="date">%(asctime)s</span>   <span class="label">file:</span><span class="filename">%(filename)s</span>   <span class="label">method:</span><span class="funcName">%(funcName)s</span>   <span class="label">line#:</span><span class="lineno">%(lineno)d</span> <span class="pathname">%(pathname)s</span>  <div class="right"><span class="message">%(message)s</span><span class="levelname">%(levelname)s</span></div></div>'
            datefmt: '%Y-%m-%d <span class= "time">%H:%M <span class= "seconds">%Ss</span></span>'
    handlers:
        console:
            class: logging.StreamHandler
            level: WARNING
            formatter: console_style
            stream: ext://sys.stdout
        file:
            class: logging.handlers.GroupWriteRotatingFileHandler
            level: WARNING
            formatter: file_style
            filename: /Users/Dave/.config/soxspipe/soxspipe.log
            mode: w+
            maxBytes: 102400
            backupCount: 1
            delay: True
    root:
        level: INFO
        handlers: [file,console]

