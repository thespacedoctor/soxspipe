            poly-fitting-residual-clipping-sigma: 5
            # MAXIMUM NUMBER OF CLIPPING ITERATIONS WHEN FITTING GLOBAL POLYNOMIAL TO OBJECT TRACE
            poly-clipping-iteration-limit: 7
        qc-acceptable-ranges:
            detector-temp: [0,50]
            badpix-frac: [-0.001,0.01]
            eff-median: [0.02,0.5]
            inner-order-pix-mean: [-40,60]
            samples-det-frac: [0.7,1.01]
            samples-clip-frac: [-0.01,0.3]
            snr-median: [7,200]
