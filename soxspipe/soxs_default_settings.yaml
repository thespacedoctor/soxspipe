            order-deg: 3
            # CLIPPING LIMIT (MEDIAN AND MAD) WHEN FITTING GLOBAL POLYNOMIAL TO OBJECT TRACE
            poly-fitting-residual-clipping-sigma: 4
            # MAXIMUM NUMBER OF CLIPPING ITERATIONS WHEN FITTING GLOBAL POLYNOMIAL TO ORDER CENTRES
            poly-clipping-iteration-limit: 5
            # ANCHOR THE TRACE OF A FAINT VIS ORDER TO ITS BRIGHT NEIGHBOUR AND REFIT IT ON BINNED PROFILES
            faint-order-trace: True
            # AN ORDER IS FAINT WHEN FEWER THAN THIS FRACTION OF ITS SAMPLES ARE DETECTED
            faint-order-min-detection-fraction: 0.5
            # AN ORDER IS FAINT WHEN THE MAD SCATTER OF ITS CENTRE SHIFT ABOUT A DEGREE-2 FIT EXCEEDS THIS (PIXELS)
            faint-order-max-scatter-px: 1.5
            # A FAINT ORDER CAN STILL ANCHOR ITS FAINT NEIGHBOUR WHEN IT IS DETECTED OFTEN ENOUGH AND ITS SCATTER IS AT MOST THIS (PIXELS)
            faint-order-max-anchor-scatter-px: 3.0
            # NUMBER OF WAVELENGTH BINS A FAINT ORDER IS COLLAPSED INTO
            faint-order-bin-count: 15
            # A BIN IS KEPT ONLY WHEN ITS PEAK SIGNAL-TO-NOISE RATIO IS AT LEAST THIS
            faint-order-min-bin-snr: 3.0
            # WARN WHEN ADJACENT ORDERS DISAGREE ON THE SLIT POSITION OF THE TRACE AT THEIR JOIN BY MORE THAN THIS (ARCSEC)
            same-source-max-join-arcsec: 2.0
    nir:
        # LA COSMIC SIGMA CLIPPING LIMIT
        lacosmic-sigma: 25
        detect-continuum:
            # NUMBER OF CROSS-ORDER SLICES PER ORDER
            order-sample-count: 150
            # LENGTH OF EACH SLICE (PIXELS)
            slice-length: 50
            # WIDTH OF EACH SLICE (PIXELS)
            slice-width: 5
            # HEIGHT GAUSSIAN PEAK MUST BE ABOVE MEDIAN FLUX TO BE "DETECTED" BY CODE (STD VIA MEDIAN ABSOLUTE DEVIATION).
            peak-sigma-limit: 2.
            # WARN WHEN THE FITTED TRACE OF AN ORDER IS EXTRAPOLATED ACROSS MORE THAN THIS FRACTION OF THE ORDER WITH NO ACCEPTED SAMPLE
            max-unsampled-trace-fraction: 0.2
            # DEGREE OF ORDER-COMPONENT OF GLOBAL POLYNOMIAL FIT TO OBJECT TRACE
            order-deg: 6
            # DEGREE OF Y-COMPONENT OF GLOBAL POLYNOMIAL FIT TO OBJECT TRACE
            disp-axis-deg: 4
            # CLIPPING LIMIT (MEDIAN AND MAD) WHEN FITTING GLOBAL POLYNOMIAL TO OBJECT TRACE
            poly-fitting-residual-clipping-sigma: 5
            # MAXIMUM NUMBER OF CLIPPING ITERATIONS WHEN FITTING GLOBAL POLYNOMIAL TO OBJECT TRACE
            poly-clipping-iteration-limit: 7
            
            

