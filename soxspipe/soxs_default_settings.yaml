soxs-stare:
    # STACK ALL OBJECT FRAMES OF THE SOF BEFORE EXTRACTION. SET TO False TO EXTRACT EACH FRAME ON ITS OWN
    # (FLUX STANDARDS ARE ALWAYS STACKED)
    stack_before_extraction: True
    # DIVIDE IMAGE BY MASTER FLAT FRAME
    use_flat: True
    # FIT AND SUBTRACT THE INTRA-ORDER BACKGROUND LIGHT
    subtract_background: True
    # STACKED FRAME CLIPPING PARAMETERS. DATA IS CLIPPED DURING STACKING.
    stacked-clipping-sigma: 15
    stacked-clipping-iterations: 3
    # USE LA COSMIC TO REMOVE CRHs BEFORE EXTRACTION
    use_lacosmic: True 
    vis:
        # LA COSMIC SIGMA CLIPPING LIMIT
        lacosmic-sigma: 25
        # THE LENGTH OF THE 'SLIT' USED TO COLLECT OBJECT FLUX (IN PIXELS)
        horne-extraction-slit-length: 15
        # DEGREE OF THE POLYNOMIAL USED TO FIT THE DISPERSION-DIRECTION PROFILES OF THE OBJECT
        horne-extraction-profile-poly-order: 7
