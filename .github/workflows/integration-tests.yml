name: Integration Tests

on:
  pull_request:
    branches:
      - main
    # A CHANGE THAT TOUCHES ONLY CHANGES.md CANNOT CHANGE A TEST RESULT
    paths-ignore:
      - "CHANGES.md"
  schedule:
    - cron: "17 3 * * 1"


jobs:
  call-workflow:
    uses: thespacedoctor/reusable-workflows/.github/workflows/integration-tests.yml@main
