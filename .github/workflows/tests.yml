name: Required tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: required-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DECIDES WHETHER THE REQUIRED SUITE NEEDS TO RUN, WITH THE SHARED change-scope WORKFLOW IN
  # thespacedoctor/reusable-workflows. THE SUITE IS SKIPPED WHEN THE CHANGE TOUCHES ONLY
  # CHANGES.md, OR WHEN A PUSH TO A PULL REQUEST ONLY MOVED ITS BASE (A MERGE FROM, OR REBASE
  # ONTO, develop THAT LEFT THE PULL REQUEST'S OWN CODE DIFF UNCHANGED) AND THE RUN ON THE
  # PREVIOUS HEAD PASSED (DY-2452). THE SECOND RULE ACCEPTS THAT THE PULL REQUEST'S CODE IS NOT
  # RE-TESTED ON TOP OF THE NEW develop. THE WORKFLOW ITSELF STILL RUNS, BECAUSE `tests` IS A
  # REQUIRED CHECK ON main: A JOB SKIPPED BY `if` COUNTS AS PASSED, BUT A WORKFLOW SKIPPED BY
  # `paths-ignore` LEAVES THE CHECK PENDING AND BLOCKS THE MERGE. ANY DOUBT RUNS THE SUITE
  changes:
    permissions:
      contents: read
      actions: read
    uses: thespacedoctor/reusable-workflows/.github/workflows/change-scope.yml@main

  # RUNS ON EVERY CHANGE, INCLUDING A CHANGES.md-ONLY ONE. THE SCRIPT USES THE STANDARD
  # LIBRARY ONLY, SO IT NEEDS NO PACKAGE INSTALL
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Reject duplicate changelog entries
        run: python tools/check_changelog.py CHANGES.md

  tests:
    needs: changes
    # RUNS UNLESS `changes` SUCCEEDED AND SAID `false`: A FAILED `changes` JOB MUST NOT SKIP
    # THE SUITE, BECAUSE A SKIPPED `tests` JOB PASSES THE REQUIRED CHECK
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLAS_NUM_THREADS: "1"
      HOME: /tmp/soxspipe-required/home
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/soxspipe-required/matplotlib
      NUMBA_CACHE_DIR: /tmp/soxspipe-required/numba
      NUMEXPR_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      VECLIB_MAXIMUM_THREADS: "1"
      XDG_CACHE_HOME: /tmp/soxspipe-required/cache
      XDG_CONFIG_HOME: /tmp/soxspipe-required/config
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          mkdir -p "$HOME" "$MPLCONFIGDIR" "$NUMBA_CACHE_DIR" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME"
          python -m pip install -e ".[tests]"

      # THE LINT RATCHET IS THE diff-cover GATE'S SIBLING: BOTH JUDGE ONLY CHANGED LINES
      - name: Enforce changed-line lint
        run: python tools/lint_ratchet.py --compare-branch origin/develop

      # UNLIKE THE LINT RATCHET THIS GATE IS ABSOLUTE: THE WHOLE TREE WAS REFORMATTED
      # IN DY-850, SO ANY UNFORMATTED FILE IS NEW. THE ruff VERSION IS THE ONE PINNED IN
      # pyproject.toml, WHICH A LOCAL ruff MAY NOT MATCH; REFORMAT WITH THAT VERSION
      - name: Enforce ruff format
        run: ruff format --check .

      # -n auto STARTS ONE WORKER PER PHYSICAL CORE (2 ON THE HOSTED RUNNER). -n logical (4 WORKERS)
      # WAS SLOWER IN DY-1673: THE RUNNER HAS LITTLE SPARE CPU, SO EACH TEST RAN 2.5-3.5 TIMES SLOWER
      - name: Run required suite
        run: |
          mkdir -p reports
          chmod -R a-w soxspipe
          python_path="$(command -v python)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          sudo unshare --net --setgid="$runner_gid" --setuid="$runner_uid" -- \
            /usr/bin/env \
            BLAS_NUM_THREADS="$BLAS_NUM_THREADS" \
            EXPECTED_UID="$runner_uid" \
            HOME="$HOME" \
            MKL_NUM_THREADS="$MKL_NUM_THREADS" \
            MPLBACKEND="$MPLBACKEND" \
            MPLCONFIGDIR="$MPLCONFIGDIR" \
            NUMBA_CACHE_DIR="$NUMBA_CACHE_DIR" \
            NUMEXPR_NUM_THREADS="$NUMEXPR_NUM_THREADS" \
            OPENBLAS_NUM_THREADS="$OPENBLAS_NUM_THREADS" \
            OMP_NUM_THREADS="$OMP_NUM_THREADS" \
            PYTHONDONTWRITEBYTECODE="$PYTHONDONTWRITEBYTECODE" \
            PYTHONHASHSEED="$PYTHONHASHSEED" \
            PYTHON_PATH="$python_path" \
            VECLIB_MAXIMUM_THREADS="$VECLIB_MAXIMUM_THREADS" \
            XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" \
            /bin/bash -c '
              test "$(id -u)" = "$EXPECTED_UID"
              test ! -w soxspipe
              exec "$PYTHON_PATH" -m pytest tests/unit tests/integration \
                -m "not slow" \
                -n auto \
                --cov=soxspipe \
                --cov=tools \
                --cov-branch \
                --cov-report=term-missing \
                --cov-report=xml:reports/coverage.xml \
                --cov-report=json:reports/coverage.json \
                --junitxml=reports/junit.xml
            '

      - name: Enforce whole-package coverage ratchet
        run: coverage report | tee reports/coverage.txt

      - name: Enforce changed-line coverage
        run: diff-cover reports/coverage.xml --compare-branch=origin/develop --fail-under=80

      - name: Add coverage to job summary
        if: always()
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f reports/coverage.txt ]]; then
            cat reports/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report unavailable because an earlier step failed." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: required-test-reports
          path: |
            reports/coverage.xml
            reports/coverage.json
            reports/coverage.txt
            reports/junit.xml
